<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RH E-SPORTS — Register</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-material-ui/material-ui.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components/loader.css">
    <link rel="stylesheet" href="css/pages/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="register" data-base="">

    <div data-include="loader"></div>

    <!-- AUTH VIEW -->
    <div id="auth-view" class="active">
        <div class="auth-container">
            <div id="register-container" style="display:flex; flex-direction:column;">
                <div class="auth-title">Let's Start</div>
                <div class="auth-subtitle">Create an account</div>
                <div class="auth-card">
                    <div class="auth-tabs">
                        <button class="auth-tab" onclick="window.toggleAuthMode('login')">Login</button>
                        <button class="auth-tab active" onclick="window.toggleAuthMode('register')">Register</button>
                    </div>
                    <form id="registerForm" class="auth-form active" onsubmit="window.emailRegister(); return false;">
                        <div class="form-group"><label>Full Name</label><input type="text" id="reg-username" placeholder="Your name" required></div>
                        <div class="form-group"><label>Email Address</label><input type="email" id="reg-email" placeholder="your@email.com" required></div>
                        <div class="form-group"><label>Mobile Number</label><input type="number" id="reg-phone" placeholder="01XXXXXXXXX" required></div>
                        <div class="form-group"><label>Password</label><input type="password" id="reg-pass" placeholder="Min 6 characters" required></div>
                        <button type="submit" class="btn-auth">Sign Up</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="js/pages/register.js"></script>
</body>
</html>
