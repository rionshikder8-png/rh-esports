<!-- ROOM DETAILS MODAL -->
<div id="room-modal" class="modal">
    <div class="modal-box">
        <div class="popup-close-btn" onclick="document.getElementById('room-modal').classList.remove('active')">✕</div>
        <div class="popup-title" style="text-align:center; margin-bottom:15px;">ROOM DETAILS</div>
        <div style="text-align:center; margin-bottom:15px;">
            <div style="font-size:12px; color:var(--text-gray);">Room ID</div>
            <div style="font-size:20px; font-weight:900; color:var(--text-dark);" id="popup-room-id">--</div>
            <button class="am-copy-btn" onclick="window.copyToClipboard('popup-room-id')">Copy</button>
        </div>
        <div style="text-align:center;">
            <div style="font-size:12px; color:var(--text-gray);">Password</div>
            <div style="font-size:20px; font-weight:900; color:var(--text-dark);" id="popup-room-pass">--</div>
            <button class="am-copy-btn" onclick="window.copyToClipboard('popup-room-pass')">Copy</button>
        </div>
    </div>
</div>
