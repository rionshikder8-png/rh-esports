<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RH E-SPORTS — Add Money</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-material-ui/material-ui.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/components/loader.css">
    <link rel="stylesheet" href="../../css/components/bottom-nav.css">
    <link rel="stylesheet" href="../../css/pages/wallet.css">
    <link rel="stylesheet" href="../../css/components/modal.css">
    <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body data-page="add-money" data-base="../../" class="sub-page">

    <div data-include="loader"></div>

    <main id="main-content" class="show">
        <section id="add-money-view" class="app-section active">
            <button class="back-nav" onclick="window.navigateSub('wallet')">
                <i class="fa-solid fa-arrow-left"></i> Add Money
            </button>

            <div class="method-grid">
                <div class="method-card active" id="tab-bkash" onclick="window.switchPayTab('bkash')">
                    <img src="https://i.ibb.co.com/qF1xD5xj/image-search-1769091253468.png" alt="bKash"><span>bKash</span>
                </div>
                <div class="method-card" id="tab-rocket" onclick="window.switchPayTab('rocket')">
                    <img src="https://i.ibb.co.com/MDt4TzDf/image-search-1769091463880.png" alt="Rocket"><span>Rocket</span>
                </div>
                <div class="method-card" id="tab-nagad" onclick="window.switchPayTab('nagad')">
                    <img src="https://i.ibb.co.com/4gmdTj1f/image-search-1769091285966.png" alt="Nagad"><span>Nagad</span>
                </div>
            </div>

            <div id="content-bkash" class="am-box">
                <div style="font-weight:800; margin-bottom:10px;">bKash Payment</div>
                <input type="text" id="trx-bkash" class="am-input" placeholder="Enter Transaction ID">
                <div style="font-size:12px; margin-bottom:10px;">Send Money to: <b id="bkash-num-display">Loading...</b> <button class="am-copy-btn" onclick="window.copyToClipboard('bkash-num-display')">Copy</button></div>
            </div>
            <div id="content-rocket" class="am-box" style="display:none;">
                <div style="font-weight:800; margin-bottom:10px;">Rocket Payment</div>
                <input type="text" id="trx-rocket" class="am-input" placeholder="Enter Transaction ID">
                <div style="font-size:12px; margin-bottom:10px;">Send Money to: <b id="rocket-num-display">Loading...</b> <button class="am-copy-btn" onclick="window.copyToClipboard('rocket-num-display')">Copy</button></div>
            </div>
            <div id="content-nagad" class="am-box" style="display:none;">
                <div style="font-weight:800; margin-bottom:10px;">Nagad Payment</div>
                <input type="text" id="trx-nagad" class="am-input" placeholder="Enter Transaction ID">
                <div style="font-size:12px; margin-bottom:10px;">Send Money to: <b id="nagad-num-display">Loading...</b> <button class="am-copy-btn" onclick="window.copyToClipboard('nagad-num-display')">Copy</button></div>
            </div>

            <button class="am-verify-btn" onclick="window.triggerVerify()">VERIFY</button>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../../js/pages/add-money.js"></script>
</body>
</html>
